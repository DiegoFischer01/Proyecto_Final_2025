<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viaggio - Destino y Alojamiento</title>
    <link
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/alojamientos.css" />
    <link
      rel="shortcut icon"
      href="../Imagenes/home/logo.svg"
      type="image/x-icon"
    />
  </head>

  <body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="../index.html">
          <img
            src="../Imagenes/home/logo.svg"
            alt="Logo Viaggio"
            style="height: 40px"
          />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-toggle="collapse"
          data-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item">
              <a class="nav-link" href="destinos.html">Destinos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="sobreViaggio.html">Sobre Viaggio</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main>
      <!-- Sección de Destino -->
      <div class="container mt-5">
        <h2 class="text-center mb-4">Elige tu destino</h2>

        <!-- Selector de ciudad -->
        <div class="row mb-3">
          <div class="col-12">
            <label for="ciudad">Seleccione su ciudad:</label>
            <select class="form-control" id="ciudad">
              <option value="" disabled selected>Seleccione una ciudad</option>
              <option value="Olavarria">Olavarría</option>
              <option value="Tandil" disabled style="color: gray">
                Tandil (próximamente)
              </option>
              <option value="Mar del Plata" disabled style="color: gray">
                Mar del Plata (próximamente)
              </option>
            </select>
          </div>
        </div>

        <!-- Sección de Fechas -->

          <div class="form-group">
            <label for="fecha-llegada">Fecha de llegada:</label>
            <input
              type="text"
              class="form-control datepicker"
              id="fecha-llegada"
              placeholder="Selecciona una fecha de llegada"
            />
          </div>

        <!-- Campo opcional de fecha de regreso -->
        <div class="form-group">
          <label for="fecha-regreso">Fecha de regreso (opcional)</label>
          <input
            type="text"
            class="form-control datepicker"
            id="fecha-regreso"
            name="fecha-regreso"
            placeholder="Selecciona una fecha de regreso"
          />
        </div>

        <!-- Sección Presupuesto (opcional) -->
        <label for="presupuesto">Presupuesto (opcional)</label>
        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <span class="input-group-text">$</span>
          </div>
          <input
            type="text"
            class="form-control presupuesto"
            aria-label="Amount (to the nearest dollar)"
            placeholder="Introduce cuanto dinero pretendes gastar"
          />
        </div>

        <div class="row mt-4 text-center">
          <div class="col-12">
            <button
              id="btn-continuar"
              class="btn btn-warning btn-lg d-block mx-auto"
            >
              Continuar
            </button>
          </div>
        </div>

        <!-- Sección de Alojamientos -->
        <div
          class="container mt-5"
          id="seccion-alojamientos"
          style="display: none"
        >
          <h2 class="text-center mb-4">Elige tu alojamiento</h2>
          <div class="row align-items-stretch"></div>
        </div>
      </div>
    </main>

    <!-- Boton VER ACTIVIDADES -->
    <div
      class="text-center my-5"
      id="contenedor-actividades"
      style="display: none"
    >
      <button class="btn btn-lg px-5 py-3" id="btn-ver-actividades">
        Ver actividades
      </button>
    </div>

    <!-- FOOTER -->
    <footer>
      <div class="divSucursales">
        <p>Sucursales</p>
        <p>Calle inventada 1234</p>
        <p>Calle alternativa 5679</p>
      </div>
      <div>
        <img src="../Imagenes/home/logo.svg" alt="Logo" class="logoFooter" />
      </div>
      <div class="divRedes">
        <a href="https://www.facebook.com/?locale=es_LA" target="_blank">
          <img
            src="../Imagenes/home/facebook.png"
            alt="Facebook"
            class="logosRedes"
          />
        </a>
        <a href="https://x.com/" target="_blank">
          <img
            src="../Imagenes/home/twitter.png"
            alt="Twitter"
            class="logosRedes"
          />
        </a>
        <a href="https://www.instagram.com/" target="_blank">
          <img
            src="../Imagenes/home/instagram.png"
            alt="Instagram"
            class="logosRedes"
          />
        </a>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>
    <script src="../js/alojamientos.js" type="module"></script>
  </body>
</html>
